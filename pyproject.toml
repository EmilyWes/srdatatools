[project]
name = "srdatatools"
version = "0.1.0"
description = "Local tool for importing, merging, deduplicating, enriching, and exporting academic paper metadata."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "sqlalchemy>=2",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
