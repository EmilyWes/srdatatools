[project]
name = "srdatatools"
version = "0.1.0"
description = "Local tool for importing, merging, deduplicating, enriching, and exporting academic paper metadata."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "platformdirs>=4",
    "nicegui>=2",
    "pywebview>=5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
]
build = [
    "pyinstaller>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
